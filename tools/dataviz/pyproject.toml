[project]
name = "lewm-dataviz"
version = "0.1.0"
description = "Local browser visualizer for stable-worldmodel HDF5 recordings"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.12,<4",
    "numpy>=2.1,<3",
    "pillow>=11,<13",
]

[project.scripts]
dataviz = "dataviz.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataviz"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
