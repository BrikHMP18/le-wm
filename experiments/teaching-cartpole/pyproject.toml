[project]
name = "lewm-teaching-cartpole"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "h5py>=3.12,<4",
    "numpy>=2.1,<3",
    "pillow>=11,<13",
    "pygame>=2.6,<3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
